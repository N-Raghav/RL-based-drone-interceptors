# One shared defender policy (parameter sharing) over AS-Defend-Role-v0, via shared_wrapper.py:
# skrl sees one agent in 3 x num_envs envs. Policy: the defender's own observation.
# Critic: own observation + the true global state.
seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False  # the env clamps; clipping here breaks the PPO ratio
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -0.5
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: tanh(ACTIONS)  # bounded mean
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 32
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.995
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.002
  value_loss_scale: 2.0
  kl_threshold: 0.05  # stop the epoch loop if an update moves the policy too far
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "tello_defend_shared"
    experiment_name: "tello_defend_shared_ppo"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 6000
  environment_info: log
